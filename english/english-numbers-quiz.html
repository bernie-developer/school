<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Números en Inglés</title>

    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/english-numbers-quiz.css">

    <script src="../data/i18n.js" defer></script>
    <script src="../js/components.js" defer></script>
    <script src="../js/lang-manager.js" defer></script>
    <script src="../js/english-numbers-quiz.js" defer></script>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">
    <school-navbar base-path="../"></school-navbar>

    <main class="module-main">
        <div class="quiz-container">
            <div id="quizScreen">
                <h1 id="title"></h1>
                <div class="progress" id="progress"></div>
                <div class="question" id="question"></div>
                <input type="number" id="answer" min="1" max="20" placeholder="?" autofocus>
                <br>
                <button onclick="checkAnswer()" id="btn-check"></button>
                <div class="feedback" id="feedback"></div>
                <button id="nextBtn" class="hidden" onclick="nextQuestion()"></button>
                <div class="score" id="score"></div>
            </div>

            <div id="endScreen" class="hidden">
                <h1 id="title-end"></h1>
                <div class="final-score" id="finalScore"></div>
                <button onclick="startNewGame()" id="btn-restart"></button>
            </div>
        </div>
    </main>

    <school-footer></school-footer>
</body>
</html>
