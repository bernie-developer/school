<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Talent Test</title>

    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/talent-test.css">

    <script src="../data/i18n.js" defer></script>
    <script src="../js/components.js" defer></script>
    <script src="../js/lang-manager.js" defer></script>
    <script src="../js/talent-test.js" defer></script>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">
    <school-navbar base-path="../"></school-navbar>

    <main class="module-main">
        <div class="max-w-2xl w-full mt-12">
            <!-- Welcome screen -->
            <div id="welcome-screen" class="card p-8 text-center border-4 border-sky-300">
                <h1 class="text-4xl font-bold text-sky-600 mb-8" id="title-main"></h1>
                <label for="user-name"></label><input type="text" id="user-name" placeholder="" class="text-2xl border-4 border-sky-100 rounded-full py-4 px-6 w-full mb-8 focus:outline-none focus:border-sky-400 text-center shadow-inner">

                <button onclick="startQuiz()" id="btn-start" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg transition transform hover:scale-105"></button>
            </div>

            <!-- Quiz screen -->
            <div id="quiz-screen" class="hidden">
                <header class="flex justify-between items-center mb-6">
                    <h2 id="greeting" class="text-2xl font-bold text-sky-600"></h2>
                    <div class="bg-white px-4 py-2 rounded-full border-2 border-sky-200 font-bold" id="progress-container">
                        <span id="q-text"></span> <span id="current-count"></span>
                    </div>
                </header>

                <div id="questions-container" class="space-y-6">
                    <!-- Questions injected here -->
                </div>

                <div class="mt-10 text-center">
                    <button onclick="submitQuiz()" id="btn-submit" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg transition"></button>
                </div>
            </div>

            <!-- Results screen -->
            <div id="result-screen" class="hidden card p-8 text-center border-4 border-amber-300">
                <h2 id="result-title" class="text-4xl font-bold mb-4"></h2>
                <p id="result-score" class="text-6xl font-bold text-sky-500 mb-6"></p>
                <div id="result-details" class="text-left bg-gray-50 p-6 rounded-2xl mb-6 max-h-80 overflow-y-auto border-2 border-gray-100"></div>
                <button onclick="reloadPage()" id="btn-retry" class="bg-sky-500 text-white font-bold py-3 px-10 rounded-full text-xl hover:bg-sky-600 transition"></button>
            </div>
        </div>
    </main>

    <school-footer></school-footer>
</body>
</html>
